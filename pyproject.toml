[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mp4-quality-bypass"
version = "1.0.0"
description = "High-FPS Container Injection & FastStart Optimizer for Social Media Uploads (TikTok, Reels, Shorts)"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [
    { name = "Community Contributor" }
]
keywords = [
    "mp4",
    "tiktok",
    "reels",
    "video-optimizer",
    "compression-bypass",
    "faststart",
    "ffmpeg",
    "davinci-resolve"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
]

[project.scripts]
mp4-bypass = "optimizer:main"

[tool.setuptools]
py-modules = ["optimizer"]
